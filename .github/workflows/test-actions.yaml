name: Test actions

on:
  push:
    branches: [main]
    paths: ["actions/**"]
  pull_request:
    paths: ["actions/**", ".github/workflows/test-actions.yaml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test 'actions/**/*.test.js'
