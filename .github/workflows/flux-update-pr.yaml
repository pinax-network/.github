# Reusable workflow: turn a Flux ImageUpdateAutomation push branch into a pull request that
# carries the upstream release notes, assigned per component.
#
# Flux detects the new tag and pushes the bump to a branch; this workflow only adds what Flux
# cannot: which release notes apply, whether they mention anything that needs operator action,
# and who has to review it. See docs/flux-update-pr.md in this repository for the config format.
#
# Caller (in the k8s-* repo):
#
#   on:
#     push:
#       branches: ["*/*-updates"]
#   jobs:
#     pr:
#       uses: pinax-network/.github/.github/workflows/flux-update-pr.yaml@main
#       permissions:
#         contents: read
#         pull-requests: write
#       secrets:
#         release-notes-token: ${{ secrets.PAT_INTERNAL_REPOSITORIES }}

name: Flux update PR

on:
  workflow_call:
    inputs:
      config:
        description: Path of the component config in the calling repository.
        type: string
        default: .github/flux-updates.yaml
      base:
        description: Branch the Flux automation checks out and the PR targets.
        type: string
        default: main
    secrets:
      release-notes-token:
        description: >-
          Token that can read releases of private upstream repositories. The PR itself is always
          opened with GITHUB_TOKEN, so the PAT owner can still be assigned or asked to review.
        required: false

jobs:
  pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: flux-update-pr-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read config
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          if [ -f "$CONFIG" ]; then
            yq -o=json '.' "$CONFIG" > "$RUNNER_TEMP/flux-updates.json"
          else
            echo "::notice::$CONFIG not found, using defaults for every component"
            echo '{}' > "$RUNNER_TEMP/flux-updates.json"
          fi

      - name: Create or update pull request
        uses: actions/github-script@v8
        env:
          BASE: ${{ inputs.base }}
          CONFIG_JSON: ${{ runner.temp }}/flux-updates.json
          RELEASE_NOTES_TOKEN: ${{ secrets.release-notes-token }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');

            const run = (cmd, args) => execFileSync(cmd, args, { encoding: 'utf8', maxBuffer: 64 << 20 });
            const { owner, repo } = context.repo;
            const base = process.env.BASE;
            const head = context.ref.replace(/^refs\/heads\//, '');
            const cfg = JSON.parse(fs.readFileSync(process.env.CONFIG_JSON, 'utf8')) || {};
            const defaults = cfg.defaults || {};
            const components = cfg.components || {};
            // Release-note sections an operator must read before merging, lifted to the top of the PR.
            const deploySections = new RegExp(
              defaults['deploy-sections'] ||
                '^(deploy(ment)?|upgrad(e|ing)|breaking|behaviou?r change|migration|action required|config(uration)? change|operator)',
              'i',
            );
            const breaking = new RegExp(defaults['breaking-pattern'] || 'breaking change|\\bBREAKING\\b|backwards?[- ]incompatible', 'i');

            // Sections of a markdown body whose heading matches re, each running until the next heading
            // of the same or a higher level.
            const sectionsOf = (body, re) => {
              const out = [];
              let cur = null;
              for (const line of (body || '').split(/\r?\n/)) {
                const h = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line);
                if (h && cur && h[1].length <= cur.level) cur = null;
                if (h && !cur && re.test(h[2])) {
                  cur = { level: h[1].length, heading: h[2], text: [] };
                  out.push(cur);
                  continue;
                }
                if (cur) cur.text.push(line);
              }
              return out.map((c) => ({ heading: c.heading, text: c.text.join('\n').trim() })).filter((c) => c.text);
            };
            // Same Octokit class (with paginate/rest plugins) as `github`, authenticated with the notes token.
            const notesClient = process.env.RELEASE_NOTES_TOKEN
              ? new github.constructor({ auth: process.env.RELEASE_NOTES_TOKEN })
              : github;

            // ---- 1. What did Flux change? Pair removed/added lines that carry a $imagepolicy marker.

            const mergeBase = run('git', ['merge-base', `origin/${base}`, 'HEAD']).trim();
            const diff = run('git', ['diff', '--unified=0', '--no-color', mergeBase, 'HEAD']);

            const tagOf = (value, field) => {
              value = value.replace(/@sha256:[a-f0-9]+$/, '');
              if (field === 'tag') return value;
              const colon = value.lastIndexOf(':');
              return colon > value.lastIndexOf('/') ? value.slice(colon + 1) : value;
            };

            const parseMarkerLine = (line) => {
              const hash = line.search(/#\s*\{.*"\$imagepolicy"/);
              if (hash < 0) return null;
              let marker;
              try {
                marker = JSON.parse(line.slice(line.indexOf('{', hash)));
              } catch {
                return null;
              }
              const [ns, name, field] = marker.$imagepolicy.split(':');
              const m = line.slice(0, hash).match(/^\s*(?:-\s*)?[^:\s]+\s*:\s*(.*?)\s*$/);
              if (!m) return null;
              const value = m[1].replace(/^["']|["']$/g, '');
              return { policy: `${ns}/${name}`, name, tag: tagOf(value, field) };
            };

            const removed = new Map();
            const added = new Map();
            let file = null;
            for (const line of diff.split('\n')) {
              if (line.startsWith('+++ ')) {
                file = line.replace(/^\+\+\+ (b\/)?/, '');
                continue;
              }
              if (line.startsWith('--- ') || !/^[+-]/.test(line)) continue;
              const parsed = parseMarkerLine(line.slice(1));
              if (!parsed) continue;
              const key = `${file}\0${parsed.policy}`;
              const into = line[0] === '-' ? removed : added;
              if (!into.has(key)) into.set(key, []);
              into.get(key).push(parsed);
            }

            const changes = new Map(); // policy|old|new -> change
            for (const [key, adds] of added) {
              const dels = removed.get(key) || [];
              const [path] = key.split('\0');
              adds.forEach((a, i) => {
                const old = dels[i]?.tag;
                if (old === a.tag) return;
                const id = `${a.policy}|${old}|${a.tag}`;
                if (!changes.has(id)) changes.set(id, { policy: a.policy, name: a.name, from: old, to: a.tag, files: [] });
                changes.get(id).files.push(path);
              });
            }

            if (changes.size === 0) {
              core.notice(`No $imagepolicy changes between ${base} and ${head}; nothing to do.`);
              return;
            }

            // ---- 2. Map each change to a component and collect its release notes.

            const componentFor = (change) => {
              for (const [id, c] of Object.entries(components)) {
                const policies = c.policies || [id];
                if (policies.some((p) => p === change.name || p.replace(':', '/') === change.policy)) {
                  return { id, ...defaults, ...c };
                }
              }
              return { id: change.name, ...defaults };
            };

            const semver = (s) => {
              const m = /^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+.*)?$/.exec(s || '');
              return m && { major: +m[1], minor: +m[2], patch: +m[3], pre: m[4] || '' };
            };
            const cmp = (a, b) => {
              for (const k of ['major', 'minor', 'patch']) if (a[k] !== b[k]) return a[k] - b[k];
              if (a.pre === b.pre) return 0;
              if (!a.pre) return 1;
              if (!b.pre) return -1;
              return a.pre.localeCompare(b.pre, undefined, { numeric: true });
            };

            // The version that matters to operators is often not the image/chart tag itself:
            // a chart's appVersion tracks the server release that carries the changelog.
            const appVersion = (comp, tag) => {
              if (comp.version !== 'appVersion') return tag;
              if (!comp.chart) throw new Error(`${comp.id}: version: appVersion needs a chart reference`);
              const chart = run('helm', ['show', 'chart', comp.chart, '--version', tag]);
              const m = /^appVersion:\s*["']?([^"'\s]+)/m.exec(chart);
              if (!m) throw new Error(`${comp.id}: no appVersion in ${comp.chart}@${tag}`);
              return m[1];
            };

            const releasesCache = new Map();
            const listReleases = async (fullName) => {
              if (releasesCache.has(fullName)) return releasesCache.get(fullName);
              const [o, r] = fullName.split('/');
              const all = [];
              for await (const page of notesClient.paginate.iterator(notesClient.rest.repos.listReleases, { owner: o, repo: r, per_page: 100 })) {
                all.push(...page.data);
                if (all.length >= 500) break;
              }
              releasesCache.set(fullName, all);
              return all;
            };

            const entries = [];
            for (const change of changes.values()) {
              const comp = componentFor(change);
              const entry = { change, comp, releases: [], notes: [], deploy: [], breaking: [] };
              entries.push(entry);
              if (!comp.repo) {
                entry.notes.push('_No upstream repository configured for this component._');
                continue;
              }
              try {
                const from = change.from && appVersion(comp, change.from);
                const to = appVersion(comp, change.to);
                entry.fromVersion = from;
                entry.toVersion = to;
                const prefix = comp['tag-prefix'] || '';
                const lo = semver(from);
                const hi = semver(to);
                if (!hi) {
                  const sha = (t) => /^([a-f0-9]{7,40})(?:-\d+)?$/.exec(t || '')?.[1];
                  if (sha(from) && sha(to)) {
                    entry.notes.push(`[Commits ${sha(from)}...${sha(to)}](https://github.com/${comp.repo}/compare/${sha(from)}...${sha(to)})`);
                  } else {
                    entry.notes.push(`_\`${to}\` is not a semantic version; no release notes looked up._`);
                  }
                  continue;
                }
                const wantPre = comp['include-prereleases'] || Boolean(hi.pre);
                entry.releases = (await listReleases(comp.repo))
                  .filter((r) => !r.draft && (wantPre || !r.prerelease) && r.tag_name.startsWith(prefix))
                  .map((r) => ({ ...r, v: semver(r.tag_name.slice(prefix.length)) }))
                  .filter((r) => r.v && cmp(r.v, hi) <= 0 && (!lo || cmp(r.v, lo) > 0))
                  .sort((a, b) => cmp(b.v, a.v));
                for (const r of entry.releases) {
                  for (const sec of sectionsOf(r.body, deploySections)) entry.deploy.push({ release: r, ...sec });
                  if (breaking.test(r.body || '')) entry.breaking.push(r.tag_name);
                }
                if (entry.releases.length === 0) {
                  entry.notes.push(`_No GitHub releases found in ${comp.repo} between \`${from ?? '?'}\` and \`${to}\`._`);
                }
                if (lo) {
                  entry.notes.push(`[Full diff ${prefix}${from}...${prefix}${to}](https://github.com/${comp.repo}/compare/${prefix}${from}...${prefix}${to})`);
                }
              } catch (err) {
                const status = err.status ? ` (HTTP ${err.status})` : '';
                core.warning(`${comp.id}: release notes unavailable${status}: ${err.message}`);
                entry.notes.push(
                  err.status === 404
                    ? `_Release notes unavailable: no read access to \`${comp.repo}\`. Pass a token that can read it as \`release-notes-token\`._`
                    : `_Release notes unavailable: ${err.message}_`,
                );
              }
            }

            // ---- 3. Render the managed part of the PR body.

            const BEGIN = '<!-- flux-update-pr:begin -->';
            const END = '<!-- flux-update-pr:end -->';
            const code = (s) => (s ? `\`${s}\`` : '_new_');
            const lines = [BEGIN, '## Updates', '', '| Component | From | To | Release notes | Files |', '|---|---|---|---|---|'];
            for (const e of entries) {
              const ver = (tag, v) => (v && v !== tag ? `${code(tag)} (app ${code(v)})` : code(tag));
              const flags = [
                e.breaking.length && `:warning: breaking (${e.breaking.join(', ')})`,
                e.deploy.length && 'deploy notes',
              ].filter(Boolean);
              const notes = [`${e.releases.length}`, ...flags].join(', ');
              lines.push(`| ${e.comp.id} | ${ver(e.change.from, e.fromVersion)} | ${ver(e.change.to, e.toVersion)} | ${notes} | ${e.change.files.map(code).join('<br>')} |`);
            }
            if (entries.some((e) => e.breaking.length)) {
              lines.push('', '> [!WARNING]', '> Release notes in this update announce a breaking change. Read them before merging.');
            }
            if (entries.some((e) => e.deploy.length)) {
              lines.push('', '## Before merging', '');
              for (const e of entries) {
                for (const d of e.deploy) {
                  lines.push(`#### ${e.comp.id} [${d.release.tag_name}](${d.release.html_url}): ${d.heading}`, '', d.text, '');
                }
              }
            }
            const bodyLimit = 60000;
            let truncated = false;
            for (const e of entries) {
              lines.push('', `## ${e.comp.id} ${e.change.from ? `${e.change.from} → ` : ''}${e.change.to}`, '');
              for (const r of e.releases) {
                const date = (r.published_at || r.created_at || '').slice(0, 10);
                const block = [`<details open><summary><b>${r.tag_name}</b> (${date}) <a href="${r.html_url}">release</a></summary>`, '', (r.body || '_No description._').trim(), '', '</details>', ''];
                if (lines.join('\n').length + block.join('\n').length > bodyLimit) {
                  truncated = true;
                  lines.push(`- [${r.tag_name}](${r.html_url}) (${date})`);
                } else {
                  lines.push(...block);
                }
              }
              lines.push(...e.notes);
            }
            if (truncated) lines.push('', '_Some release notes were too long for the PR body; follow the links above._');
            lines.push('', `<sub>Generated by [flux-update-pr](https://github.com/pinax-network/.github/blob/main/.github/workflows/flux-update-pr.yaml) from \`${head}\`.</sub>`, END);
            const managed = lines.join('\n');

            // ---- 4. Create or update the pull request, then assign it.

            const scope = head.includes('/') ? head.split('/')[0] : head.replace(/-fluxcd-image-updates$/, '');
            const bumps = entries.map((e) => `${e.comp.id} to ${e.change.to}`);
            let title = `${scope}: bump ${bumps.join(', ')}`;
            if (title.length > 120) title = `${scope}: bump ${entries.length} components`;

            const { data: open } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${head}`, base, state: 'open' });
            let pr = open[0];
            if (pr) {
              const old = pr.body || '';
              const body = old.includes(BEGIN) && old.includes(END)
                ? old.slice(0, old.indexOf(BEGIN)) + managed + old.slice(old.indexOf(END) + END.length)
                : `${managed}\n\n${old}`.trim();
              ({ data: pr } = await github.rest.pulls.update({ owner, repo, pull_number: pr.number, title, body }));
              core.info(`Updated #${pr.number}`);
            } else {
              ({ data: pr } = await github.rest.pulls.create({ owner, repo, head, base, title, body: managed }));
              core.info(`Created #${pr.number}`);
            }

            const union = (key) => [...new Set(entries.flatMap((e) => e.comp[key] || []))];
            const assignees = union('assignees');
            const reviewers = union('reviewers').filter((r) => r !== pr.user.login);
            const labels = union('labels');
            const tryApi = async (what, fn) => {
              try {
                await fn();
              } catch (err) {
                core.warning(`Could not ${what}: ${err.message}`);
              }
            };
            if (assignees.length) await tryApi(`assign ${assignees}`, () => github.rest.issues.addAssignees({ owner, repo, issue_number: pr.number, assignees }));
            if (reviewers.length) await tryApi(`request review from ${reviewers}`, () => github.rest.pulls.requestReviewers({ owner, repo, pull_number: pr.number, reviewers }));
            if (labels.length) await tryApi(`label ${labels}`, () => github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels }));

            await core.summary
              .addHeading(`#${pr.number}: ${title}`, 3)
              .addLink(pr.html_url, pr.html_url)
              .addRaw(`\n\nAssignees: ${assignees.join(', ') || 'none'}; reviewers: ${reviewers.join(', ') || 'none'}`)
              .write();
